DiagnosticMapper_PKIX=TLS handshake failed: certificate is not trusted (PKIX).
DiagnosticMapper_PKIX_Remediation=How to fix: \n\
1) Export the certificate from your browser (Chrome/Edge/Firefox): \n\
   - Open the site in the browser. \n\
   - Click the lock icon in the address bar. \n\
   - Chrome/Edge: choose \"Certificate\" / \"View certificate\". \n\
     Firefox: choose \"View certificate\". \n\
   - Open the \"Certificate path\" / \"Details\" tab. \n\
   - Click \"Copy to file\" (Chrome) or \"Export\" (Firefox). \n\
   - Save the certificate as .cer or .crt (Base64 or DER if asked). \n\
 \n\
2) Import the certificate into the Java truststore using keytool: \n\
   - Command (replace placeholders with your values): \n\
     keytool -importcert -alias <alias> -file <cert_file> -keystore <keystore_path> -storepass <password> \n\
   - Where: \n\
     <alias>         unique entry name in the store, \n\
     <cert_file>     path to the exported certificate (.cer/.crt), \n\
     <keystore_path> truststore path (usually: $JAVA_HOME/lib/security/cacerts), \n\
     <password>      store password (default for cacerts: changeit). \n\
\
3) Verify the certificate was added: \n\
   keytool -list -keystore <keystore_path> -storepass <password> | findstr /i <alias> \n\
\
Notes:\
- In corporate networks with TLS inspection (MITM), you need the corporate Root CA provided by your network/security admin. \n\
- Self-signed certificates must be imported into the truststore (usually cacerts). \n\
- If you use a custom JKS/PKCS12, use an absolute path. \n\
  Windows example: C:\\path\\to\\keystore.jks \n\
- Check file permissions and Java version: keytool must match the Java used to run Eclipse (see java.home in the report).\n

DiagnosticMapper_Timeout=Timeout while waiting for response.
DiagnosticMapper_Timeout_Remediation=How to fix: \n\
1) If you are on a corporate network, check the proxy settings in EDT. \n\
2) If you are using a VPN, disconnect the VPN and run diagnostics again. \n\
3) Retry the diagnosis later. If the error persists, contact ailab@1c.ru 

DiagnosticMapper_DNS=DNS resolution failed.
DiagnosticMapper_DNS_Remediation=How to fix: \n\
1) Check the server address in the plugin settings (URL). \n\
2) If you are on a corporate network, the domain may only be accessible via VPN or corporate DNS: enable VPN and rerun diagnostics. \n\
3) Request your administrator to add the address to the allowlist (firewall/proxy exceptions) for https://code.1c.ai and all its subdomains (e.g., https://code.1c.ai/chat etc.)

