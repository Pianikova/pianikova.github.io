DiagnosticMapper_401=Authentication failed: token is invalid or expired. (HTTP 401)
DiagnosticMapper_401_Remediation=How to fix: \n\
1) Open plugin settings and verify the token field is not empty. \n\
2) Paste the token again (no spaces/newlines). \n\
3) Re-login / generate a new token and update it in the settings. \n\
4) Run diagnostics again.

DiagnosticMapper_403=Access denied: token is valid but user doesn't have access to the API. (HTTP 403)
DiagnosticMapper_403_Remediation=How to fix: \n\
1) Ensure you are using the correct account/token (the token can be valid but belong to another user). \n\
2) If the error persists, contact your administrator and request the required API permissions/role. \n\
3) After permissions are granted, rerun diagnostics.

DiagnosticMapper_407=Proxy authentication required. (HTTP 407)
DiagnosticMapper_407_Remediation=How to fix: \n\
1) Go to Window > Preferences > General > Network Connections. \n\
2) Set Active Provider to Direct. Run the diagnostics again. If this doesn't help, follow the steps below. \n\
3) Set Active Provider to Manual. \n\
4) In the table below, select the protocols (HTTP, HTTPS) and click Edit. \n\
5) Enter the proxy server address, port, and your username and password. \n\
6) Additionally: If you are on a corporate network, contact your system administrator to obtain the correct credentials, as the 407 error indicates an authentication failure. \n\
7) Restart the development environment and run the diagnostics again.

DiagnosticMapper_500=Server returned an internal error.
DiagnosticMapper_500_Remediation=How to fix: \n\
1) Verify the URL in parameters is correct (if a custom URL is set, clear the parameter). Try running diagnostics again. \n\
2) If the problem persists, contact ailab@1c.ru and provide the report log.

DiagnosticMapper_Unknown=A network error occurred while running diagnostics.
DiagnosticMapper_Unknown_Remediation=1) Verify the URL is correct on the settings page. \n\
2) Remove the URL parameter from the parameters line, if specified. \n\
3) Restart diagnostics. If the error persists, contact support at ailab@1c.ru and provide the report log.

